name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foghorn
          POSTGRES_PASSWORD: foghorn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foghorn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The database tests fail rather than skip when CI is set and this is missing.
      FOGHORN_TEST_DATABASE_URL: postgres://foghorn:foghorn@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
